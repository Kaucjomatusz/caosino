<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>CAOSino - Tibia 6-Reel Edition</title>
<style>
*{box-sizing:border-box}
body{background:#0b0d0f url('tlo.jpg') no-repeat center center fixed;background-size:cover;color:#d1d5db;font-family:'Verdana','Arial',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;user-select:none;overflow:hidden;position:relative;padding:0 275px}

#fire-container{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:hidden}
.ambient-fire{position:absolute;width:130px;height:130px;background:url('fire-field-tibia.gif') no-repeat center center;background-size:contain;image-rendering:pixelated;filter:drop-shadow(0 0 10px #ff3300);animation:fireFlicker 1.5s infinite alternate ease-in-out;opacity:.85}
@keyframes fireFlicker{from{transform:scale(1)}to{transform:scale(1.08)}}

#bonus-hud{background:rgba(20,22,24,.92);border:2px solid #f39c12;border-radius:6px;padding:10px 15px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 15px rgba(0,0,0,.8)}
.hud-title{font-size:11px;color:#f39c12;font-weight:bold;text-transform:uppercase;border-bottom:1px solid #444;padding-bottom:3px;text-align:center}
.hud-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:bold;gap:10px}
.hud-badge{background:#111214;padding:2px 6px;border-radius:3px;border:1px solid #333;color:#0f0;font-size:11px}

.header-section{display:flex;flex-direction:column;align-items:center;margin:5px 0 10px;z-index:10}
.logo-title{font-size:48px;font-weight:bold;text-transform:uppercase;letter-spacing:3px;color:#f39c12;text-shadow:2px 2px 0 #000,-2px -2px 0 #000;margin:0}

.dashboard{display:flex;gap:15px;font-size:16px;margin-bottom:10px;background:#1c1e20;padding:8px 20px;border:2px solid #4a4e53;border-radius:4px;box-shadow:inset 0 0 8px #000;align-items:center;z-index:10}
.bet-box{background:#282c30;padding:4px 10px;border-radius:4px;border:1px solid #5a5e63;text-align:center}
.bet-selector-list{display:flex;gap:5px;margin-top:2px}
.bet-badge{background:#111214;padding:2px 5px;border-radius:3px;font-size:11px;color:#777;border:1px solid #333;cursor:pointer}
.bet-badge.active{background:#f39c12;color:#000;font-weight:bold}

.slot-machine { display: flex; gap: 12px; background: #181a1c; padding: 22px; border: 4px solid #4a4e53; outline: 3px solid #1c1e20; box-shadow: inset 0 0 25px #000, 0 0 0 2px #f39c12, 0 10px 25px rgba(0,0,0,0.9); border-radius: 0px; position: relative; z-index: 10; transform: none !important; transition: none !important; will-change: auto !important; }
.slot-machine:hover { transform: none !important; transition: none !important; }

.reel-container{display:flex;flex-direction:column;align-items:center}
.reel-strip{width:100px;height:380px;background:#0f1012;border:2px solid #5a5e63;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;overflow:hidden;box-shadow:inset 0 0 15px #000;position:relative}
.slot-item{width:72px;height:72px;display:flex;align-items:center;justify-content:center;transition:all .2s ease;position:relative}
.slot-item.top-item,.slot-item.bottom-item{transform:scale(.85);filter:brightness(.6)}
.slot-item.center-item{transform:scale(1.05);filter:brightness(1.1);z-index:2}
.slot-item.win-cell img{filter:drop-shadow(0 0 10px #0f0) brightness(1.4)!important;transform:scale(1.25)}
.slot-item img{width:64px;height:64px;image-rendering:pixelated}

.hold-btn{margin-top:8px;padding:5px 10px;font-size:12px;font-weight:bold;background:#2b2e32;color:#888;border:1px solid #4a4e53;border-radius:3px;cursor:pointer}
.hold-btn.active{background:#c0392b;color:#fff;border-color:#f39c12;box-shadow:0 0 8px #c0392b}

#right-panel{position:fixed;top:12px;right:12px;width:262px;max-height:calc(100vh - 24px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;z-index:100}
.history-box{background:rgba(24,26,28,.95);border:2px solid #4a4e53;border-radius:4px;padding:6px 15px;box-shadow:inset 0 0 8px #000;display:flex;flex-direction:column;align-items:stretch;gap:6px}
.history-title{font-size:11px;color:#f39c12;font-weight:bold;text-transform:uppercase}
.history-list{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:bold}
.history-item{background:#111214;padding:3px 8px;border-radius:3px;border:1px solid #333;color:#0f0}

.controls-hint{color:#aaa;font-size:12px;text-align:left;line-height:1.7;background:rgba(24,26,28,.95);padding:6px 16px;border-radius:4px;border:2px solid #4a4e53;z-index:10}
.controls-hint key{color:#f39c12;font-weight:bold}

.credits-panel{background:#1c1e20;border:2px solid #f39c12;border-radius:4px;padding:10px;text-align:center;font-size:15px;box-shadow:inset 0 0 8px #000}
.credits-panel #credits{display:block;color:#0f0;font-size:28px;font-weight:bold;margin-top:2px}

#npc-column{position:fixed;left:15px;top:10px;bottom:10px;width:250px;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;z-index:90;pointer-events:none}
.npc-slot{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transform:translateX(-300px);transition:all .6s cubic-bezier(.175,.885,.32,1.275)}
.npc-slot.visible{opacity:1;transform:translateX(0)}
.npc-img-style{width:80px;height:80px;image-rendering:pixelated}
.speech-bubble{position:relative;background:#fff8dc;color:#000;font-size:13px;font-weight:bold;padding:10px 15px;border-radius:8px;border:2px solid #8b4513;box-shadow:2px 2px 8px rgba(0,0,0,.7);max-width:260px}

#raid-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,0,0,.88);z-index:250;display:none;flex-direction:column;align-items:center;justify-content:center;border:4px solid #c0392b}
.raid-box{background:#1c1e20;border:3px solid #e74c3c;padding:25px 40px;border-radius:8px;text-align:center;box-shadow:0 0 30px #c0392b;display:flex;flex-direction:column;align-items:center;gap:12px}
.raid-box h2{color:#e74c3c;margin:0;font-size:24px;text-transform:uppercase}
.raid-monster-img{width:96px;height:96px;image-rendering:pixelated}
.raid-choices{display:flex;gap:20px;margin-top:15px}
.raid-choice-btn{background:#c0392b;color:#fff;border:2px solid #e74c3c;padding:10px 25px;font-size:16px;font-weight:bold;cursor:pointer;border-radius:4px;transition:all 0.2s}
.raid-choice-btn:hover{background:#e74c3c;box-shadow:0 0 10px #e74c3c}

#info-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(11,13,15,.9);z-index:300;display:none;align-items:center;justify-content:center}
.info-box{background:#1c1e20;border:3px solid #f39c12;width:760px;max-height:88vh;border-radius:8px;padding:20px 30px;box-shadow:0 0 30px rgba(0,0,0,.9);overflow-y:auto;color:#d1d5db}
.info-box h2{color:#f39c12;text-align:center;margin-top:0;text-transform:uppercase}
.info-section-title{color:#0f0;font-size:15px;margin-top:15px;margin-bottom:5px;border-bottom:1px solid #444;padding-bottom:3px}
.info-table{width:100%;font-size:12px;border-collapse:collapse;margin-top:5px}
.info-table th,.info-table td{border:1px solid #3e4247;padding:5px 10px;text-align:left}
.info-table th{background:#25282a;color:#f39c12}
.close-info-btn{display:block;margin:20px auto 0;background:#f39c12;color:#000;border:none;padding:8px 25px;font-weight:bold;font-size:14px;border-radius:4px;cursor:pointer}

#win-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center}
#win-overlay img{max-width:220px;max-height:220px;filter:drop-shadow(0 0 20px #f39c12);animation:popupBounce .5s ease-out}
@keyframes popupBounce{0%{transform:scale(0);opacity:0}50%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<div id="fire-container"></div>

<div id="npc-column">
    <div id="npc-ferumbras" class="npc-slot">
        <div class="speech-bubble">Exori Vis Benedictio!</div>
        <img src="ferumbras.png" class="npc-img-style" alt="Ferumbras">
    </div>
    <div id="npc-rashid" class="npc-slot">
        <div class="speech-bubble">Witaj travelerze!</div>
        <img src="rashid.png" class="npc-img-style" alt="Rashid">
    </div>
    <div id="npc-norma" class="npc-slot">
        <div class="speech-bubble">Słuchaj dobrych rad!</div>
        <img src="norma.png" class="npc-img-style" alt="Norma">
    </div>
</div>

<div class="header-section">
    <h1 class="logo-title">CAOSino</h1>
</div>

<div class="dashboard">
    <div class="bet-box">
        COINS: <span id="coin-count" style="color:#0f0;font-weight:bold">1000</span>
    </div>
    <div class="bet-box">
        LINIE: <span id="lines-count" style="color:#f39c12;font-weight:bold">1</span>/20
    </div>
    <div class="bet-box">
        STAWKA/LINIA: <span id="bet-per-line" style="color:#f39c12;font-weight:bold">10</span>
    </div>
    <div class="bet-box">
        RAZEM: <span id="total-bet" style="color:#ff3300;font-weight:bold">10</span>
    </div>
    <div class="bet-box">
        STATUS AUTO: <span id="auto-status-badge" style="color:#aaa">WYŁ</span>
    </div>
</div>

<div class="slot-machine" id="machine-wrapper">
    <!-- Nakładka SVG do rysowania zaawansowanych linii wygrywających -->
    <svg id="lines-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99;"></svg>

    <!-- 6 BĘBNÓW -->
    <div class="reel-container" data-reel="0">
        <div class="reel-strip" id="reel-0"></div>
        <button class="hold-btn" onclick="toggleHold(0)">HOLD [1]</button>
    </div>
    <div class="reel-container" data-reel="1">
        <div class="reel-strip" id="reel-1"></div>
        <button class="hold-btn" onclick="toggleHold(1)">HOLD [2]</button>
    </div>
    <div class="reel-container" data-reel="2">
        <div class="reel-strip" id="reel-2"></div>
